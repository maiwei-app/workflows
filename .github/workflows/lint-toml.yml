name: Lint TOML

on:
  workflow_call: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install taplo
        run: |
          url="https://github.com/tamasfe/taplo/releases/download"
          url="${url}/0.9.3/taplo-full-linux-x86_64.gz"
          curl -fsSL --proto '=https' --tlsv1.2 "$url" \
            | gunzip -c > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo

      - name: Validate TOML syntax
        run: |
          mapfile -d '' files < <(find . -name '*.toml' \
            -not -path './.git/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .toml files found, nothing to lint"
            exit 0
          fi
          taplo check "${files[@]}"
