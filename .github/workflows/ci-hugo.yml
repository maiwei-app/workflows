name: CI Hugo

on:
  workflow_call:
    inputs:
      hugo-version:
        type: string
        default: 'latest'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo-version }}
          extended: true

      - name: Build (strict)
        run: hugo --gc --minify --panicOnWarning
