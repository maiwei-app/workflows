name: CI Hugo

on:
  workflow_call:
    inputs:
      hugo-version:
        type: string
        default: 'latest'
      theme-name:
        description: >
          Set only when the consuming repo IS a Hugo theme, not a site.
          Checks out into themes/<theme-name> and builds
          themes/<theme-name>/exampleSite instead of the repo root,
          matching how Hugo resolves a theme by its directory name.
        type: string
        required: false
        default: ''
      verify-css-selectors:
        description: >
          Theme mode only. Comma-separated CSS selectors that must appear
          in the generated CSS, as a build sanity check.
        type: string
        required: false
        default: ''
      min-css-bytes:
        description: Theme mode only. Minimum size in bytes for the generated CSS.
        type: number
        required: false
        default: 10000

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (site)
        if: inputs.theme-name == ''
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout (theme)
        if: inputs.theme-name != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: themes/${{ inputs.theme-name }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo-version }}
          extended: true

      - name: Build site (strict)
        if: inputs.theme-name == ''
        run: hugo --gc --minify --panicOnWarning

      - name: Build theme exampleSite
        if: inputs.theme-name != ''
        run: hugo --source themes/${{ inputs.theme-name }}/exampleSite --themesDir ../.. --cleanDestinationDir --minify

      - name: Verify generated CSS
        if: inputs.theme-name != ''
        env:
          MIN_BYTES: ${{ inputs.min-css-bytes }}
          SELECTORS: ${{ inputs.verify-css-selectors }}
        run: |
          set -euo pipefail
          CSS="$(find themes/${{ inputs.theme-name }}/exampleSite/public/css -name '*.css' | head -1)"
          if [[ -z "$CSS" ]]; then
            echo "::error::No CSS file was generated by the build"
            exit 1
          fi
          BYTES="$(wc -c < "$CSS")"
          echo "Generated CSS: $CSS ($BYTES bytes)"
          if [[ "$BYTES" -lt "$MIN_BYTES" ]]; then
            echo "::error::Generated CSS is $BYTES bytes: below the $MIN_BYTES minimum, SCSS likely didn't compile"
            exit 1
          fi
          if [[ -n "$SELECTORS" ]]; then
            IFS=',' read -ra SEL_ARRAY <<< "$SELECTORS"
            for SELECTOR in "${SEL_ARRAY[@]}"; do
              if ! grep -qF -- "$SELECTOR" "$CSS"; then
                echo "::error::Generated CSS is missing expected selector: $SELECTOR"
                exit 1
              fi
            done
            echo "Verified selectors: $SELECTORS"
          fi
