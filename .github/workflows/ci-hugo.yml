name: CI Hugo

on:
  workflow_call:
    inputs:
      hugo-version:
        type: string
        default: 'latest'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ inputs.hugo-version }}
          extended: true

      - name: Build (strict)
        run: hugo --gc --minify --panicOnWarning
