name: No AI attribution

on:
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI attribution in commits or PR
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          AUTHOR_PATTERN='claude|anthropic|copilot|\[bot\]'
          ATTRIB_PATTERN='co-authored-by:.*(claude|anthropic|copilot)|'
          ATTRIB_PATTERN="${ATTRIB_PATTERN}generated (with|by)"
          ATTRIB_PATTERN="${ATTRIB_PATTERN}.*(claude|anthropic|copilot)|"
          ATTRIB_PATTERN="${ATTRIB_PATTERN}noreply@anthropic|🤖"
          FAIL=0
          RANGE="origin/$BASE_REF..$HEAD_SHA"

          if git log "$RANGE" --format='%an <%ae> / %cn <%ce>' \
            | grep -viE 'maibot-app\[bot\]' \
            | grep -inE "$AUTHOR_PATTERN"; then
            echo "::error::AI author or committer detected in commits"
            FAIL=1
          fi

          if git log "$RANGE" --format='%B' | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::AI attribution detected in commit messages"
            FAIL=1
          fi

          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -inE "$ATTRIB_PATTERN"; then
            echo "::error::AI attribution detected in PR title or body"
            FAIL=1
          fi

          exit $FAIL
