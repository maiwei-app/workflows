name: Repo initialized

on:
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Generate maibot-app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MAIBOT_APP_ID }}
          private-key: ${{ secrets.MAIBOT_APP_PRIVATE_KEY }}

      - name: Check sw-checks-init
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          value=$(gh api "repos/${{ github.repository }}/properties/values" \
            --jq '.[] | select(.property_name=="sw-checks-init") | .value')
          echo "sw-checks-init=${value}"
          if [ "${value}" != "true" ]; then
            echo "::error::sw-checks-init is '${value}'. This repo has not completed and proven its Custom-Stack CI setup (see the Calidad del Código policy page). Run the setup flow before merging."
            exit 1
          fi
