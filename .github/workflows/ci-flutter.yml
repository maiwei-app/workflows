name: CI Flutter

on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        default: 'stable'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-version }}

      - name: Install dependencies
        run: flutter pub get --no-precompile

      - name: Verify dependency lock
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "Error: pubspec.lock not found"
            exit 1
          fi
          # Verify lock file is not empty and contains dependencies
          if [ ! -s pubspec.lock ] || ! grep -q "packages:" pubspec.lock; then
            echo "Error: pubspec.lock is empty or invalid"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test
