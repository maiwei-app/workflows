name: CI Flutter

on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        default: 'stable'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-version }}

      - name: Install dependencies with lock verification
        run: |
          flutter pub get --no-precompile

          # Verify pubspec.lock exists and contains locked versions
          if [ ! -f pubspec.lock ]; then
            echo "Error: pubspec.lock not found - dependencies not locked"
            exit 1
          fi

          # Generate and verify hash of lock file to ensure deterministic builds
          LOCK_HASH=$(sha256sum pubspec.lock | cut -d' ' -f1)
          echo "Dependency lock file verified (hash: ${LOCK_HASH:0:16}...)"

          # Ensure lock file is valid YAML and contains package definitions
          if ! grep -q "^packages:" pubspec.lock; then
            echo "Error: pubspec.lock is malformed or empty"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test
