name: Sonar scan

on:
  workflow_call:
    inputs:
      project-key:
        type: string
        required: true
      sonar-organization:
        type: string
        required: false
        default: maiwei-app
      coverage-artifact:
        # Artifact holding coverage.xml, as uploaded by ci-python.yml. Empty
        # means no coverage data: Sonar then reports 0% on new code, which
        # fails a quality gate that requires coverage.
        type: string
        required: false
        default: ''
    secrets:
      sonar-token:
        required: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: inputs.coverage-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.coverage-artifact }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
        with:
          args: >
            -Dsonar.organization=${{ inputs.sonar-organization }}
            -Dsonar.projectKey=${{ inputs.project-key }}
            ${{ inputs.coverage-artifact != '' && '-Dsonar.python.coverage.reportPaths=coverage.xml' || '' }}
