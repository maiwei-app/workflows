name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      requirements-file:
        type: string
        default: 'requirements-ci.lock'
      test-path:
        type: string
        default: 'tests/'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commits (conventional commits)
        uses: wagoid/commitlint-github-action@v6

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install tools
        run: |
          pip install -r ${{ inputs.requirements-file }} \
            --only-binary :all:

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate JSON against known schemas
        run: |
          files=$(find . -name "*.json" \
            -not -path "./node_modules/*" -not -path "./.git/*")
          if [ -n "$files" ]; then
            check-jsonschema $files
          fi

      - name: Unit tests (pytest)
        run: |
          test_path="${{ inputs.test-path }}"
          has_logic=$(find . -not -path './.git/*' \
            -not -path "./${test_path}*" -name '*.py')
          if [ -n "$has_logic" ]; then
            pytest "$test_path" -v
          else
            set +e
            pytest "$test_path" -v
            ec=$?
            set -e
            if [ "$ec" -ne 0 ] && [ "$ec" -ne 4 ] && [ "$ec" -ne 5 ]; then
              exit "$ec"
            fi
          fi
