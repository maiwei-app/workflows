name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      requirements-file:
        type: string
        default: 'requirements-ci.lock'
      test-path:
        type: string
        default: 'tests/'
      coverage:
        # Requires pytest-cov in the caller's requirements file. Leave off for
        # repos without tests: the report would be empty and Sonar would read
        # it as 0% coverage.
        type: boolean
        default: false
      coverage-artifact:
        type: string
        default: 'coverage-xml'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commits (conventional commits)
        uses: wagoid/commitlint-github-action@v6

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install tools
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          pip install -r "$REQUIREMENTS_FILE" \
            --only-binary :all:

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate JSON against known schemas
        run: |
          declare -A schemas=(
            [".release-please-config.json"]="https://raw.githubusercontent.com/googleapis/release-please/main/schemas/config.json"
            [".release-please-manifest.json"]="https://raw.githubusercontent.com/googleapis/release-please/main/schemas/manifest.json"
            [".commitlintrc.json"]="https://json.schemastore.org/commitlintrc.json"
            [".markdownlint.json"]="https://json.schemastore.org/markdownlint.json"
          )
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ -n "${schemas[$name]:-}" ]; then
              echo "Validating $file against ${schemas[$name]}"
              check-jsonschema --schemafile "${schemas[$name]}" "$file"
            else
              python3 -m json.tool "$file" > /dev/null
              echo "No known schema for $name — validated syntax only"
            fi
          done < <(find . -name "*.json" \
            -not -path "./node_modules/*" -not -path "./.git/*" -print0)

      # Inputs travel through env, never interpolated into the script: a
      # ${{ }} expansion inside run: is a shell injection vector.
      - name: Unit tests (pytest)
        env:
          TEST_PATH: ${{ inputs.test-path }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          cov_args=()
          if [ "$COVERAGE" = "true" ]; then
            cov_args=(--cov=. --cov-report=xml:coverage.xml)
          fi
          has_logic=$(find . -not -path './.git/*' \
            -not -path "./${TEST_PATH}*" -name '*.py')
          if [ -n "$has_logic" ]; then
            pytest "$TEST_PATH" -v "${cov_args[@]}"
          else
            set +e
            pytest "$TEST_PATH" -v "${cov_args[@]}"
            ec=$?
            set -e
            if [ "$ec" -ne 0 ] && [ "$ec" -ne 4 ] && [ "$ec" -ne 5 ]; then
              exit "$ec"
            fi
          fi

      # sonar-scan.yml runs as a separate job, so the report has to travel
      # as an artifact rather than on disk.
      - name: Upload coverage report
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.coverage-artifact }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1
