name: CI Python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      requirements-file:
        type: string
        default: 'requirements-ci.lock'
      test-path:
        type: string
        default: 'tests/'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commits (conventional commits)
        uses: wagoid/commitlint-github-action@v6

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install tools
        run: |
          pip install -r ${{ inputs.requirements-file }} \
            --only-binary :all: --require-hashes

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate JSON schemas
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" \
            -exec python3 -m json.tool {} \; > /dev/null

      - name: Unit tests (pytest)
        run: pytest ${{ inputs.test-path }} -v
