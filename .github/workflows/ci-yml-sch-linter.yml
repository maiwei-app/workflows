name: YAML Schema & Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML syntax
        run: yamllint -d relaxed .github/workflows/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${PWD}" >> $GITHUB_PATH

      - name: Validate GitHub Actions workflows
        run: ./actionlint -format sarif -output ./results.sarif .github/workflows/ || true

  sonar:
    needs: quality
    uses: maiwei-app/workflows/.github/workflows/sonar-scan.yml@main
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
    with:
      project-key: maiwei-app_workflows
      sonar-organization: maiwei-app
